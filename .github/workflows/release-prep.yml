# Release preparation: dispatch-only. A maintainer names the target version,
# and this workflow opens (or updates) a pull request with every version
# location and the CHANGELOG entry already bumped. It never tags, releases,
# or publishes: publication happens only when a protected vX.Y.Z tag is
# pushed (see release.yml, added in a later work unit).
name: release-prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version as X.Y.Z (no v prefix)"
        required: true
        type: string

# Least privilege for the job's purpose: push the generated branch and open
# or update its pull request. This workflow cannot create tags or releases
# and contains no publish steps.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1. Pinned to main so a dispatch from a stale
        # or non-default ref still generates the prep branch off the default
        # branch. persist-credentials stays at its default (true) because the
        # push step below needs the persisted token.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Install pnpm (version from the packageManager pin)
        # pnpm/action-setup v6.0.10
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node 24
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Runs first on purpose: the script strictly validates the version and
      # self-verifies every location, so a bad input fails the job before any
      # branch push or PR step can run.
      - name: Prepare release metadata
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: pnpm exec tsx scripts/release-prep.ts "$VERSION"

      - name: Commit the generated changes
        # Git pushes commits, not working trees: without this step the
        # pushed branch (and the PR) would be empty. The bot identity is
        # required or the commit itself fails on the runner.
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v$VERSION"

      # The branch is fully generated from the checked-out commit, so a
      # forced update is safe and keeps repeated dispatches idempotent.
      - name: Push the generated branch
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: git push --force origin "HEAD:refs/heads/release-prep/v$VERSION"

      - name: Open or update the preparation pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
          BODY: |
            Automated release preparation for v${{ github.event.inputs.version }}.

            Bumps the five synchronized version locations, the Pi README install
            pins, and the CHANGELOG entry. Generated by the `release-prep`
            workflow; see RELEASING.md for the full process.

            **Merging this pull request does not publish anything.** To publish:
            after merge, push tag `v${{ github.event.inputs.version }}`; the
            release workflow validates the tag against main and the changelog
            before publishing to npm.
        run: |
          head="release-prep/v$VERSION"
          title="chore(release): v$VERSION"
          existing=$(gh pr list --head "$head" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$BODY"
          else
            gh pr create --base main --head "$head" --title "$title" --body "$BODY"
          fi
